name: Release

# Pushing a tag such as v0.1.0 builds the Windows installer from that commit
# and publishes it as a GitHub release, notes from docs/releases/<tag>.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Check the tag is the app's version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME, but the app is version $version"
            exit 1
          fi
      - run: pnpm test
      - run: pnpm tauri build
      # The installer also goes up as Quiera-Setup-x64.exe: the website links to
      # releases/latest/download/Quiera-Setup-x64.exe, whatever the version.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "src-tauri/target/release/bundle/nsis/Quiera_${version}_x64-setup.exe" Quiera-Setup-x64.exe
          sha256sum Quiera-Setup-x64.exe > Quiera-Setup-x64.exe.sha256
          gh release create "$GITHUB_REF_NAME" Quiera-Setup-x64.exe Quiera-Setup-x64.exe.sha256 \
            --title "Quiera $version" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
