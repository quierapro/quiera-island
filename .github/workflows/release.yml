name: Release

# Pushing a tag such as v0.1.0 builds the Windows installer from that commit
# and publishes it as a GitHub release, notes from docs/releases/<tag>.md.
# The installer is signed for the updater (secret TAURI_SIGNING_PRIVATE_KEY),
# and latest.json tells installed copies that this version is out.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Check the tag is the app's version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME, but the app is version $version"
            exit 1
          fi
      - run: pnpm test
      - run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      # Authenticode signing by SignPath (free for open source), once the
      # project is accepted: set the repository variables
      # SIGNPATH_ORGANIZATION_ID and SIGNPATH_PROJECT_SLUG and the secret
      # SIGNPATH_API_TOKEN. Until then these steps are skipped. Each request
      # waits for its manual approval in SignPath.
      - name: Collect the unsigned installer
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: src-tauri/target/release/bundle/nsis/Quiera_*_x64-setup.exe
      - name: Sign the installer with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      # Signing changes the file: the updater's signature is made again on it.
      - name: Use the signed installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          version="${GITHUB_REF_NAME#v}"
          installer="src-tauri/target/release/bundle/nsis/Quiera_${version}_x64-setup.exe"
          signed="$(find signed -name "$(basename "$installer")" | head -n 1)"
          test -n "$signed"
          cp "$signed" "$installer"
          rm -f "$installer.sig"
          pnpm tauri signer sign "$installer"
          test -s "$installer.sig"
      # The installer also goes up as Quiera-Setup-x64.exe: the website links to
      # releases/latest/download/Quiera-Setup-x64.exe, whatever the version.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          installer="src-tauri/target/release/bundle/nsis/Quiera_${version}_x64-setup.exe"
          cp "$installer" Quiera-Setup-x64.exe
          sha256sum Quiera-Setup-x64.exe > Quiera-Setup-x64.exe.sha256
          # What installed copies read: this version, its installer, and the
          # installer's signature (checked against the key built into the app).
          VERSION="$version" \
          SIGNATURE="$(cat "$installer.sig")" \
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Quiera-Setup-x64.exe" \
            node scripts/latest-json.mjs > latest.json
          # The notes, then the links every release page carries.
          {
            cat "docs/releases/$GITHUB_REF_NAME.md"
            printf '\n---\n[Code signing policy](https://quiera.eu/code-signing/) · [Confidentialité](https://quiera.eu/confidentialite/)\n'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" Quiera-Setup-x64.exe Quiera-Setup-x64.exe.sha256 latest.json \
            --title "Quiera $version" \
            --notes-file notes.md
